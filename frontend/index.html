<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        h1 { color: #333; text-align: center; }
        input { width: 70%; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background: #45a049; }
        .todo-item { display: flex; justify-content: space-between; padding: 10px; margin: 5px 0; background: #f9f9f9; border-radius: 5px; }
        .delete-btn { background: #f44336; padding: 5px 10px; }
    </style>
</head>
<body>
    <h1>📝 Todo App - MERN Stack on AWS EC2</h1>
    <div>
        <input type="text" id="todoInput" placeholder="Enter a todo..." />
        <button onclick="addTodo()">Add</button>
    </div>
    <div id="todoList"></div>

    <script>
        const API = 'http://3.85.139.252:5000';

        async function loadTodos() {
            const res = await fetch(`${API}/todos`);
            const todos = await res.json();
            const list = document.getElementById('todoList');
            list.innerHTML = todos.map(todo => `
                <div class="todo-item">
                    <span>${todo.title}</span>
                    <button class="delete-btn" onclick="deleteTodo('${todo._id}')">Delete</button>
                </div>
            `).join('');
        }

        async function addTodo() {
            const input = document.getElementById('todoInput');
            if (!input.value) return;
            await fetch(`${API}/todos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: input.value })
            });
            input.value = '';
            loadTodos();
        }

        async function deleteTodo(id) {
            await fetch(`${API}/todos/${id}`, { method: 'DELETE' });
            loadTodos();
        }

        loadTodos();
    </script>
</body>
</html>
